name: Release Latest Signed

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-signed-latest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source at build SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap Android SDK and accept licenses
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"

          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install CI Gradle properties
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
          else
            echo "::warning::.github/ci-gradle.properties not found"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      - name: Detect signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASSWORD:-}" ] && [ -n "${KS_ALIAS:-}" ] && [ -n "${KS_KEY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets found, creating signed release APK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing signing secrets. Need KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

      - name: Decode keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          ks_path="${RUNNER_TEMP}/liquidagent-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$ks_path"
          if [ ! -s "$ks_path" ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          echo "path=$ks_path" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        env:
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Psigning.storeFile="${{ steps.keystore.outputs.path }}" \
            -Psigning.storePassword="${KS_PASSWORD}" \
            -Psigning.keyAlias="${KS_ALIAS}" \
            -Psigning.keyPassword="${KS_KEY_PASSWORD}" \
            :app:assembleRelease

      - name: Locate signed APK
        id: apk
        run: |
          apk_path=$(find . -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "::error::No signed APK found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Zip release APK
        run: |
          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" dist/
          zip -j "LiquidAgent-release-latest.zip" dist/*.apk

      - name: Force latest tag to current build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.event.workflow_run.head_sha }}"
          git push origin latest --force

      - name: Publish GitHub Release for latest signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            LiquidAgent-release-latest.zip
