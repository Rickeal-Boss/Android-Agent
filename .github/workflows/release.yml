name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_JVM_ARGS: '-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

jobs:
  release:
    name: Build & publish latest release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Bootstrap Android SDK and accept licenses
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install CI Gradle properties
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
          else
            echo "::warning::.github/ci-gradle.properties not found, using project defaults"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      - name: Resolve Gradle launcher
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            echo "::error::'gradle' is not on PATH"
            exit 1
          fi
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

      - name: Verify Gradle
        run: |
          echo "Launcher: $GRADLE_CMD"
          "$GRADLE_CMD" --version

      - name: Detect signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASSWORD:-}" ] && [ -n "${KS_ALIAS:-}" ] && [ -n "${KS_KEY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble debug APK (fallback)
        id: assemble_debug
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liquidagent-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Decode keystore
        id: keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          ks_path="${RUNNER_TEMP}/liquidagent-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$ks_path"
          if [ ! -s "$ks_path" ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          echo "path=$ks_path" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        id: assemble_release
        if: steps.signing.outputs.available == 'true'
        env:
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            -Psigning.storeFile="${{ steps.keystore.outputs.path }}" \
            -Psigning.storePassword="${KS_PASSWORD}" \
            -Psigning.keyAlias="${KS_ALIAS}" \
            -Psigning.keyPassword="${KS_KEY_PASSWORD}" \
            :app:assembleRelease

      - name: Pack latest APK into zip
        if: steps.assemble_release.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          zip -j "LiquidAgent-latest.zip" dist/*.apk

      - name: Publish GitHub Release for latest build
        if: steps.assemble_release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            LiquidAgent-latest.zip

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 14
          if-no-files-found: warn
