name: Release

# ---------------------------------------------------------------------------
# LiquidAgent 发布流水线（完全可选 / 可降级）
#
# 核心约定：仓库默认没有任何 signing secrets。
#   1. debug 产物无条件产出 —— 即使一个密钥都没有，这条流水线也必须跑绿。
#   2. release 签名只在四个 SIGNING_* secrets 全部就位时才启用；
#      缺失时打印 notice 并跳过，绝不失败。
#   3. GitHub Release 仅在「push tag v*」且签名可用时创建。
#
# 需要的 secrets（全部可选，缺任何一个都走降级路径）：
#   SIGNING_KEYSTORE_BASE64   keystore 文件的 base64（openssl base64 -A -in xxx.p12）
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS         （本项目为 liquidagent）
#   SIGNING_KEY_PASSWORD      ⚠️ PKCS12 必须等于 SIGNING_KEYSTORE_PASSWORD
#                                 （PKCS12 不支持独立的 key 口令，见「Decode keystore」）
#
# 这些值通过 -P 传给 Gradle，app/build.gradle.kts 侧约定见 docs/02-ci.md。
# ---------------------------------------------------------------------------

on:
  # 手动触发：产出 APK 并上传 artifact，但【不会】创建 GitHub Release
  # （Release 需要一个真实 tag 作为锚点，分支上没有）。
  workflow_dispatch:
  # UI 分支：每次推送都跑一次「debug + R8 release 双轨」CI（用仓库密钥出签名包），
  # 这样 UI 分支的每次提交都能验证 R8 缩减与混淆规则不出问题。
  push:
    branches:
      - UI
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_JVM_ARGS: '-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

jobs:
  release:
    name: Build & (optionally) sign release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Bootstrap Android SDK and accept licenses
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install CI Gradle properties
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
            echo "::group::Effective CI gradle.properties"
            cat "$HOME/.gradle/gradle.properties"
            echo "::endgroup::"
          else
            echo "::warning::.github/ci-gradle.properties not found, using project defaults"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 上游对「不使用 wrapper 的项目」的官方写法就是 gradle-version + 直接调 gradle。
          # CI 统一走这条路径，不依赖仓库里的 wrapper。
          # 引号必需，否则 YAML 会把 9.7.1 当成非法数字。
          gradle-version: '9.7.1'
          # 该 action 默认会校验 gradle-wrapper.jar 的已知校验和。CI 根本不执行 wrapper，
          # 关掉这个校验以避免它成为额外失败面。
          # （仓库里的 jar 取自 gradle/gradle 官方 v9.7.1 tag，本身可信。）
          validate-wrappers: false
          # v6 起缓存清理参数改名为 cache-cleanup（v3/v4 叫 gradle-home-cache-cleanup）。
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      - name: Resolve Gradle launcher
        # 与 build.yml 同一策略：只用 setup-gradle 安装的 gradle 9.7.1，
        # 不留 ./gradlew 兜底分支——兜底会让「gradle 装不上」这个清晰的错误
        # 退化成难定位的 wrapper 报错。仓库的 wrapper 本身是完整可用的
        # （jar 取自 gradle/gradle 官方 v9.7.1 tag），只是 CI 不走它。
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            echo "::error::'gradle' is not on PATH — gradle/actions/setup-gradle failed to install it. Check the 'Set up Gradle' step logs and the gradle-version input."
            exit 1
          fi
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          echo "::notice::Using Gradle installed by gradle/actions/setup-gradle: $(gradle --version | head -n 3 | tr '\n' ' ')"

      - name: Verify Gradle
        run: |
          echo "Launcher: $GRADLE_CMD"
          "$GRADLE_CMD" --version

      # -------------------------------------------------------------------
      # 密钥探测：secrets 上下文在步骤 if 表达式里并不可靠，
      # 因此这里用 shell 把探测结果写进 step outputs，后续步骤用 outputs 做门禁。
      # -------------------------------------------------------------------
      - name: Detect signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASSWORD:-}" ] && [ -n "${KS_ALIAS:-}" ] && [ -n "${KS_KEY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets detected, release APK will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets NOT configured (SIGNING_KEYSTORE_BASE64 / SIGNING_KEYSTORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD). Skipping signed release build; shipping debug APK instead."
          fi

      # -------------------------------------------------------------------
      # 保底产物：无论有没有密钥都要有一个能装的 APK
      # -------------------------------------------------------------------
      - name: Assemble debug APK (fallback artifact)
        id: assemble_debug
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liquidagent-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # -------------------------------------------------------------------
      # 可选：签名 release
      # -------------------------------------------------------------------
      - name: Decode keystore
        id: keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # 【格式约定】密钥库是 PKCS12（不是 JKS），文件名用 .p12 以免误导。
          # ⚠️ PKCS12 不支持「store 口令 ≠ key 口令」：keytool 生成时会忽略 -keypass，
          #    因此 SIGNING_KEY_PASSWORD 必须与 SIGNING_KEYSTORE_PASSWORD 相同，
          #    否则 Java 取 key 时抛 UnrecoverableKeyException（已实测确认）。
          #    实测另一点：该 .p12 文件在 KeyStore.getInstance("pkcs12") 与 ("jks")
          #    两种 storeType 下都能正常 load + getKey —— 所以无论 AGP 用哪种默认
          #    keystore type，都能签成功，不存在格式歧义风险。
          ks_path="${RUNNER_TEMP}/liquidagent-release.p12"
          printf '%s' "$KS_B64" | base64 -d > "$ks_path"
          if [ ! -s "$ks_path" ]; then
            echo "::error::Decoded keystore is empty; check SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "path=$ks_path" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        id: assemble_release
        if: steps.signing.outputs.available == 'true'
        env:
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            -Psigning.storeFile="${{ steps.keystore.outputs.path }}" \
            -Psigning.storePassword="${KS_PASSWORD}" \
            -Psigning.keyAlias="${KS_ALIAS}" \
            -Psigning.keyPassword="${KS_KEY_PASSWORD}" \
            :app:assembleRelease

      - name: Assemble release AAB
        # 【修复：旧版 path 写了 bundle/release/*.aab，但全流程从未跑过 bundleRelease，
        #   那个 glob 永远匹配不到文件，又被 if-no-files-found: warn 掩盖 —— AAB 是空话。】
        #   这里真正跑一次 :app:bundleRelease，让 AAB 成为实际产物（Play 上架所需）。
        id: assemble_bundle
        if: steps.signing.outputs.available == 'true'
        env:
          KS_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            -Psigning.storeFile="${{ steps.keystore.outputs.path }}" \
            -Psigning.storePassword="${KS_PASSWORD}" \
            -Psigning.keyAlias="${KS_ALIAS}" \
            -Psigning.keyPassword="${KS_KEY_PASSWORD}" \
            :app:bundleRelease

      - name: Verify release APK signature
        # 【修复配套】光「产出一个 APK」不等于「签对了」。
        #   1) 用 apksigner 断言 v2 + v3 签名方案都命中（minSdk 31 >= 28，v3 可用）
        #   2) 断言证书 DN 不是 "CN=Android Debug" —— 否则说明 signing.* 没传到 Gradle，
        #      构建悄悄退回 debug 签名（app/build.gradle.kts 的兜底分支），
        #      这正是「有密钥却仍出 debug 包」最容易被漏掉的失败模式。
        id: verify_signature
        if: steps.assemble_release.outcome == 'success'
        run: |
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo "::error::assembleRelease reported success but no release APK found"
            exit 1
          fi
          echo "::notice::Verifying: $apk_path"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          apksigner_bin="$(ls -d "$sdk_root"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$apksigner_bin" ] || [ ! -x "$apksigner_bin" ]; then
            echo "::warning::apksigner not found under $sdk_root/build-tools/*/ — skipping signature verification (environment issue, not a build failure)."
            exit 0
          fi
          echo "::notice::apksigner: $apksigner_bin"

          log_file="${RUNNER_TEMP}/apksigner-verify.log"
          "$apksigner_bin" verify --verbose --print-certs "$apk_path" > "$log_file" 2>&1 || true
          cat "$log_file"

          if grep -q "CN=Android Debug" "$log_file"; then
            echo "::error::Release APK is signed with the DEBUG key. signing.* properties did not reach Gradle."
            exit 1
          fi
          if ! grep -qE "Verified using v2 scheme .*: true" "$log_file"; then
            echo "::error::APK Signature Scheme v2 not verified."
            exit 1
          fi
          if ! grep -qE "Verified using v3 scheme .*: true" "$log_file"; then
            echo "::error::APK Signature Scheme v3 not verified."
            exit 1
          fi
          echo "::notice::Release APK verified: v2 + v3 schemes OK, signed with the release key (not debug)."

      - name: Upload release APK / AAB / R8 mapping
        if: steps.assemble_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: liquidagent-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/configuration.txt
          retention-days: 90
          # 【修复：原来是 warn —— 正是它把「AAB 从未生成」掩盖成了静默成功。
          #  现在 APK/AAB/mapping 都是真实产物，缺任何一个都应该红。】
          if-no-files-found: error

      # -------------------------------------------------------------------
      # 发布：仅在 tag 推送 + 签名可用 时创建 GitHub Release
      # -------------------------------------------------------------------
      - name: Publish GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          steps.assemble_release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LiquidAgent ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## LiquidAgent release"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Debug APK | ${{ steps.assemble_debug.outcome || 'n/a' }} |"
            echo "| Signing secrets | ${{ steps.signing.outputs.available }} |"
            echo "| Signed release APK | ${{ steps.assemble_release.outcome || 'skipped' }} |"
            echo "| Signed release AAB | ${{ steps.assemble_bundle.outcome || 'skipped' }} |"
            echo "| Signature verified (v2+v3, non-debug) | ${{ steps.verify_signature.outcome || 'skipped' }} |"
            echo ""
            echo "R8 还原栈所需：artifact \`liquidagent-release-${GITHUB_REF_NAME}\` 内含 \`mapping.txt\` / \`configuration.txt\`。"
            echo ""
            if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo "> Signing secrets not configured — only the debug APK was produced. "
              echo "Add \`SIGNING_KEYSTORE_BASE64\`, \`SIGNING_KEYSTORE_PASSWORD\`, \`SIGNING_KEY_ALIAS\`, \`SIGNING_KEY_PASSWORD\` to enable signed releases."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
