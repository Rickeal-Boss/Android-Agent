name: Build

# ---------------------------------------------------------------------------
# LiquidAgent 主构建流水线
#
# 设计约束（来自 docs/00-recon-brief.md 与 docs/01-architecture.md）：
#   1. 仓库里没有任何 Actions variables / secrets —— 本工作流的所有步骤必须
#      「零密钥」可跑通。debug 构建不得依赖任何 secret。
#   2. 本地没有 JDK / Android SDK，唯一的验证通道就是 CI，
#      因此工作流需要自愈：用 setup-gradle 安装 Gradle、自动接受 SDK 许可、
#      缓存依赖、失败时输出可读日志。
#   3. Build job 出 debug 包；unit-tests job 跑 JVM 单测。全部 9 个模块
#      （core-model / core-engine / core-agent / core-data / core-design /
#      feature-chat / feature-models / feature-settings / app）均已有 src/test
#      源集，`test` 聚合 task 覆盖全部模块、不再有 NO-SOURCE 跳过的模块 ——
#      后续补 JVM 单测无需再改流水线。
#      ⚠️ 本注释不复述用例数 / 模块级清单：用例数每波都会变，是最容易陈旧的
#      部分。lint 由下方独立的 lint job 并行跑：
#      独立并行 = 不挤占构建关键路径（正面回应旧注释「不跑 lint，避免无关
#      任务拖垮构建」——拖垮的前提是 lint 串进 assemble 链，这里没有）；
#      lint 由独立 job 并行跑（同款工具链，不挤占构建关键路径）；Wave 32 起
#      用 baseline 门禁：35 条存量被 app/lint-baseline.xml 冻结（Wave 32 首轮 83 条
#      → Wave 37 清障后 35 条），**新增**的
#      lint 问题（含 Warning 级）会阻断 CI —— 版本通告类（GradleDependency /
#      NewerVersionAvailable / AndroidGradlePluginVersion）被显式 disable，
#      避免「上游发版就没改代码也红」的坏门禁。
#      报告先行、门禁后置。Wave 32 起走「两轮 baseline 计划」把 lint 毕业成
#      真门禁，步骤写在 lint job 的头注释里（第一轮生成并上传
#      app/lint-baseline.xml，第二轮翻 abortOnError=true）。
#   4. 【绝不下载模型】4B 模型 > 2GB，CI 只产出 APK/AAR，模型由用户自行导入。
#
# 已知回退路径（禁止提前自行改动，完整版见 docs/02-ci.md §3.2.3 / §5.2-C）：
#   · Compose 编译器 × Kotlin 不匹配 —— 报错信息本身会给出期望的 Kotlin 版本。
#     ⚠️ 不要去改 gradle/libs.versions.toml 的 kotlin 一行：AGP 9 内置 Kotlin，
#        KGP 版本由 AGP 决定，改 catalog 改不动它。正确做法见 docs/02-ci.md §5.2-C。
#   · litertlm 0.11.0 API 漂移 —— 只动 LiteRtLmEngine.kt 一个文件。
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, UI, harness, harness-improve]
    # paths-ignore：纯文档改动（docs/、任意 *.md、issue 模板）跳过本流水线 ——
    # 省掉「docs-only 要攒着一起推」的人工 workaround。
    # ⚠️ 若本流水线将来被设为分支保护的 required check，纯文档 PR 会因「无
    #    check 运行」而一直 pending；本项目未启用 required check，故可接受。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, UI, harness]
    # 同 push：纯文档改动不触发（口径见上）。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      gradle_task:
        description: '要执行的 Gradle 任务（用于模块级验证）'
        required: false
        default: ':app:assembleDebug'
        type: string
      # 开荒期模块逐个落地时（core-model → core-engine → core-agent/core-data →
      # core-design → feature-* → app），:app 可能还不存在。此时可手动触发并指定
      # 例如 ":core-model:assembleDebug" 先行验证单个模块。

# 最小权限原则：主构建只读代码
permissions:
  contents: read

# 同一 ref 上的重复触发只保留最新一次（PR 上取消在途任务，main 上不取消以保证提交可追溯）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_ARTIFACT_RETENTION_DAYS: '30'
  # 与 .github/ci-gradle.properties 保持一致；命令行 -D 优先级最高，双保险
  GRADLE_JVM_ARGS: '-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

jobs:
  assemble-debug:
    name: Assemble Debug (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # 开荒阶段不要在第一个 JDK 失败时立刻放弃其余组合，但也不要无限重试
      fail-fast: false
      matrix:
        java-version: ['21']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # -------------------------------------------------------------------
      # 工具链
      # -------------------------------------------------------------------
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ matrix.java-version }}
          # 注意：Gradle 缓存交给下面的 gradle/actions/setup-gradle 处理，
          # 这里故意不开 cache: gradle，避免两套缓存互相污染。

      - name: Bootstrap Android SDK and accept licenses
        # AGP 9 会在需要时自动下载 platform / build-tools（android.builder.sdkDownload=true），
        # 但「许可证未接受」会让下载直接失败，所以这里预先把许可哈希写好。
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "::notice::Android SDK root = $sdk_root"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"

          # 若镜像里带 cmdline-tools，再跑一次官方 license 流程做兜底
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          ls -la "$sdk_root/licenses" || true

      - name: Install CI Gradle properties
        # 用户级 ~/.gradle/gradle.properties 优先级高于项目内 gradle.properties，
        # 只放「CI 环境行为」相关开关，不覆盖项目依赖/版本决策。
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
            echo "::group::Effective CI gradle.properties"
            cat "$HOME/.gradle/gradle.properties"
            echo "::endgroup::"
          else
            echo "::warning::.github/ci-gradle.properties not found, using project defaults"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 上游对「不使用 wrapper 的项目」的官方写法就是 gradle-version + 直接调 gradle
          # （见 docs/02-ci.md §3.2.1）。CI 统一走这条路径，不依赖仓库里的 wrapper。
          # 引号必需，否则 YAML 会把 9.7.1 当成非法数字。
          gradle-version: '9.7.1'
          # 该 action 默认会校验 gradle-wrapper.jar 的已知校验和。CI 根本不执行 wrapper，
          # 这个校验对我们是纯粹的额外失败面，显式关掉。
          # （注：仓库里的 jar 是从 gradle/gradle 官方仓库 v9.7.1 tag 取的原版，本身没问题；
          #   关掉只是因为「不用就别校验」，不是因为它不可信。）
          validate-wrappers: false
          # v6 起缓存清理参数改名为 cache-cleanup（v3/v4 叫 gradle-home-cache-cleanup）。
          # on-success = 仅在构建成功时清理 Gradle User Home，避免失败后把仍需排查的依赖清掉。
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      # -------------------------------------------------------------------
      # 解析 Gradle 启动器（自愈关键点）
      # -------------------------------------------------------------------
      - name: Resolve Gradle launcher and task
        # 【只用 gradle，不用 ./gradlew】
        # 仓库的 wrapper 是完整可用的（jar 取自 gradle/gradle 官方 v9.7.1 tag），
        # 但 CI 统一走 setup-gradle 安装的 Gradle：一来少一个「jar/网络」失败面，
        # 二来 gradle-version 把版本显式钉死，行为可预期。
        # 因此这里只做「确认 + 失败即报错」，不留 wrapper 兜底分支——
        # 兜底会让「gradle 装不上」这个清晰的错误退化成难定位的 wrapper 报错。
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            echo "::error::'gradle' is not on PATH — gradle/actions/setup-gradle failed to install it. Check the 'Set up Gradle' step logs and the gradle-version input."
            exit 1
          fi
          echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          echo "::notice::Using Gradle installed by gradle/actions/setup-gradle: $(gradle --version | head -n 3 | tr '\n' ' ')"

          # 解析要执行的任务：手动触发时可用 inputs.gradle_task 做模块级验证。
          # 白名单校验：dispatch input 会被插值进 shell，只允许 Gradle 任务名字符集，
          # 避免注入（如 "; curl ..."）。
          task="${{ inputs.gradle_task }}"
          if [ -z "$task" ]; then task=":app:assembleDebug"; fi
          case "$task" in
            *[!A-Za-z0-9_:.\-]* )
              echo "::error::Invalid gradle_task: '$task'. Only [A-Za-z0-9_:.-] is allowed."
              exit 1 ;;
          esac
          echo "GRADLE_TASK=$task" >> "$GITHUB_ENV"
          echo "::notice::Gradle task: $task"

      # -------------------------------------------------------------------
      # 构建
      # -------------------------------------------------------------------
      - name: Verify Gradle
        # 先单独验证工具链可用，这样「Gradle 装不起来」和「源码编译失败」
        # 两类问题不会混在同一段日志里。
        run: |
          echo "Launcher: $GRADLE_CMD"
          "$GRADLE_CMD" --version

      - name: Architecture guard
        # 编译能过 ≠ 架构没被破坏。用 grep 强制依赖方向（思路借鉴 Edge0 的后端隔离守卫）：
        # 失败比编译失败更早暴露，且能防止「引擎细节泄漏到 UI」这类慢性返工。
        run: |
          chmod +x scripts/arch-guard.sh
          bash scripts/arch-guard.sh

      - name: Architecture guard self-test
        # 守卫自身也要被守卫：arch-guard.sh 是纯 bash、无测试，历史上出过两次
        # 「僵尸规则」事故（`grep -q` 无输出被判 OK；目录改名后空守卫永远绿）。
        # 本步在临时目录里注入违规 fixture，断言每条守卫都能报红、且干净树能过 ——
        # 防止守卫静默失效（详见 scripts/arch-guard-selftest.sh 头注释）。
        run: |
          chmod +x scripts/arch-guard-selftest.sh
          bash scripts/arch-guard-selftest.sh

      - name: Run Gradle task
        id: assemble
        # 【绝不下载模型】这里只做编译/打包；模型文件由用户自行导入，
        # CI 不会拉取任何 .litertlm / .task 权重（>2GB，见架构文档 §0.3）。
        run: |
          "$GRADLE_CMD" \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            "$GRADLE_TASK"

      # -------------------------------------------------------------------
      # 产物 / 日志
      # -------------------------------------------------------------------
      - name: Locate build output
        id: apk
        if: success()
        run: |
          # library 模块产出的是 .aar 不是 .apk，因此这里允许「没找到 APK」，
          # 只有默认任务（:app:assembleDebug）没产出 APK 才算真失败。
          apk_path="$(find . -path ./.git -prune -o -type f -name '*.apk' -print 2>/dev/null | head -n 1 || true)"
          if [ -n "$apk_path" ]; then
            echo "path=$apk_path" >> "$GITHUB_OUTPUT"
            echo "::notice::Built APK: $apk_path"
          elif [ "$GRADLE_TASK" = ":app:assembleDebug" ]; then
            echo "::error::Task :app:assembleDebug succeeded but no .apk was produced"
            find . -path ./.git -prune -o -type d -name outputs -print 2>/dev/null | head -n 20 || true
            exit 1
          else
            echo "::notice::Task $GRADLE_TASK produced no APK (library modules output .aar) — nothing to upload."
          fi

      - name: Upload APK
        # 只在确实产出 APK 时上传（library 模块任务没有 APK，跳过即可）
        if: success() && steps.apk.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: liquidagent-debug-${{ github.sha }}
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 30
          if-no-files-found: error

      - name: Upload module AARs
        # 模块级验证（如 :core-model:assembleDebug）时把 .aar 也留档，便于人工检查
        if: success() && steps.apk.outputs.path == ''
        uses: actions/upload-artifact@v4
        with:
          name: liquidagent-aars-${{ github.sha }}
          path: "**/build/outputs/aar/*.aar"
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 14
          if-no-files-found: warn

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::JDK"
          java -version 2>&1 || true
          echo "::endgroup::"
          echo "::group::SDK"
          ls "$ANDROID_HOME" 2>/dev/null | head -n 30 || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Workspace tree (build outputs)"
          find . -path ./.git -prune -o -type d -name build -print 2>/dev/null | head -n 20 || true
          echo "::endgroup::"
          echo "See the 'Upload failure reports' artifact for full Gradle reports."

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## LiquidAgent build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| JDK | ${{ matrix.java-version }} (${{ env.JAVA_DISTRIBUTION }}) |"
            echo "| Gradle | 9.7.1 (setup-gradle) |"
            echo "| Task | \`${GRADLE_TASK}\` |"
            echo ""
            if [ "${{ steps.assemble.outcome }}" = "success" ]; then
              echo "**Result:** build succeeded (artifact retention ${{ env.GRADLE_ARTIFACT_RETENTION_DAYS }} days)."
            else
              echo "**Result:** FAILED — inspect the \`build-reports-\` artifact and the Annotations panel."
              echo ""
              echo "> 若报错含 Compose 编译器 / Kotlin 版本不匹配：**不要改 \`libs.versions.toml\` 的 \`kotlin\` 一行**"
              echo "> —— AGP 9 内置 Kotlin，KGP 版本由 AGP 决定，改 catalog 无效。"
              echo "> ① 先实测 AGP 实际解析到的 KGP：\`gh workflow run build.yml -f gradle_task=buildEnvironment\`，"
              echo ">    在输出里找 \`org.jetbrains.kotlin:kotlin-gradle-plugin:<版本>\`。"
              echo "> ② 再在顶层 build 文件用 \`buildscript { classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:<版本>\") }\` 声明。"
              echo "> ③ 降级逃生舱：\`android.builtInKotlin=false\` + \`android.newDsl=false\`（两个必须同时设，AGP 10 会移除）。"
              echo "> 详见 \`docs/02-ci.md\` §5.2-C。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # JVM 单测门禁位
  #
  # 测试源集已覆盖全部 9 个模块（core-model / core-engine / core-agent /
  # core-data / core-design / feature-chat / feature-models / feature-settings /
  # app）：`test` 聚合 task 覆盖全部模块、不再有 NO-SOURCE 跳过项，
  # 后续补 JVM 单测时零改动生效。
  #
  # 工具链与 Build job 完全同源（JDK 21 temurin / Gradle 9.7.1 via
  # setup-gradle / 同一份 ci-gradle.properties），保证两个 job 共享同一套
  # Gradle 缓存口径，不会出现双 job 双缓存前缀互不命中的浪费。
  # -----------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          # 缓存交给下面的 gradle/actions/setup-gradle，与 Build job 同款约定。

      - name: Bootstrap Android SDK and accept licenses
        # 即使只跑 JVM 单测，AGP 在 configuration 阶段也需要 SDK 可用；
        # 「许可证未接受」会让 SDK 自动下载直接失败，所以照抄 Build job 的预处理。
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "::notice::Android SDK root = $sdk_root"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"

          # 若镜像里带 cmdline-tools，再跑一次官方 license 流程做兜底
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          ls -la "$sdk_root/licenses" || true

      - name: Install CI Gradle properties
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
            echo "::group::Effective CI gradle.properties"
            cat "$HOME/.gradle/gradle.properties"
            echo "::endgroup::"
          else
            echo "::warning::.github/ci-gradle.properties not found, using project defaults"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 与 Build job 同版本、同参数：两个 job 的 Gradle User Home 缓存
          # 由同一 action 以相同输入生成 key，天然共享前缀、互相命中。
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      - name: Verify Gradle
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            echo "::error::'gradle' is not on PATH — gradle/actions/setup-gradle failed to install it."
            exit 1
          fi
          gradle --version

      - name: Run unit tests
        # 【只用 setup-gradle 安装的 gradle，与 Build job 同款】不调 ./gradlew。
        # `test` 是聚合 task：对所有模块生效，空集模块 NO-SOURCE 跳过；
        # 不用 testDebugUnitTest —— 写死变体将来加纯 Kotlin 模块时会漏。
        # --continue：某模块红了也把其余模块跑完，一轮看清全部红点。
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            test --continue

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Lint 门禁位（Wave 32：两轮落地完成 —— 第一轮 CI 生成基线，第二轮提交基线并翻转）
  #
  # 为什么是独立并行 job，而不是塞进 unit-tests 或 assemble-debug：
  #   1. 不拖垮构建（历史顾虑见文件头注释）：本 job 与 assemble-debug 并行，
  #      APK 产出耗时完全不受 lint 影响；塞进 assemble 会让出包关键路径
  #      多 3~6 分钟，塞进 unit-tests 会让两类门禁的失败混在同一 job。
  #   2. 单点跑 :app:lintDebug + checkDependencies=true（见 app/build.gradle.kts
  #      lint{} 块）即可覆盖 :app 与全部 8 个 library 模块的源码，
  #      而不是 9 个模块各跑一遍 lint——后者并行展开会成倍拉高 runner 占用，
  #      且每个模块还要各自维护 lint 配置。
  #   3. 【Wave 32 两轮计划 —— 两轮均已落地】本机没有 JDK / Android SDK，
  #      baseline 只能由 lint 自己在 CI 里生成，因此分了两轮：
  #      第一轮（Build #262，abortOnError=false）：lint 首跑自动生成
  #        app/lint-baseline.xml（83 条 = 3 Error + 63 Warning + 17 Hints，
  #        覆盖 :app 与全部 8 个 library 模块），经 "Upload lint baseline"
  #        artifact 回传并提交。该轮 :app:lintDebug 以「Aborting build since
  #        new baseline file was created」失败 —— 这是 lint 的设计行为
  #        （生成基线后强制中止，逼你提交基线再重跑），不是缺陷。
  #      第二轮：基线已进仓库 ⇒ 翻 abortOnError=true 并加
  #        warningAsErrors=true（只翻 abortOnError 门禁面仅 3 条 Error，
  #        形同虚设）；Run Android Lint 步骤暂留 continue-on-error 观察
  #        一轮 —— 若基线没匹配上存量，会红 step 不红 job，确认干净后摘掉。
  #      第三轮（Wave 37 清障）：先读上一轮 CI 的 lint-reports-<sha> artifact 拿到
  #        **真实** issue 集 ⇒ 确认 baseline 未失配（55 条仍精确匹配），且其中 28 条
  #        是对已 disable 检查的失效条目 ⇒ 删 28 条 + 修 16 处 AutoboxingStateCreation
  #        + 删 4 处 RenderEffect 冗余 @RequiresApi(S)（minSdk 31 = S ⇒ 恒真），
  #        baseline 83 → 35；arch-guard 第 14 项冻结值同步降到 35。
  #      第四轮（Wave 37 收口）：lint 产物验证发现 F3 只做了一半 —— 换成
  #        mutableFloatStateOf 后**读写 `.value` 仍装箱**，lint 报 26 条
  #        AutoboxingStateValueProperty（Error，未被 baseline 吸收；因该 step 带
  #        continue-on-error，job 仍显示绿）⇒ 27 处改走原语访问器 `.floatValue`。
  #        再验产物：真实新问题 = 0、baseline 精确吸收 34 errors + 1 hint
  #        ⇒ 摘除 continue-on-error，lint 转为硬门禁。
  #   4. 重新生成基线：删掉 app/lint-baseline.xml 再跑一次本 job。
  #      ⛔ 不要手工从 lint-results XML 合成 baseline —— 报告里的 file 属性
  #      是 CI 绝对路径（/home/runner/work/...），与 baseline 的形态不一定
  #      一致，猜错就是门禁失效。让 lint 自己写。
  #
  # ✅ 观察期已结束（Wave 37 第四轮摘除）："Run Android Lint" 步骤的
  #    continue-on-error 已删除，lint 门禁为**硬门禁**（新增问题直接红 job）。
  #    摘除依据 = lint-reports artifact 显示真实新问题 0 + lint job 日志
  #    「Lint found no new issues ... BUILD SUCCESSFUL」。
  #    🔴 遗留教训：「CI 双绿」**不等于**「lint 通过」—— 观察期里 lint 实际失败
  #    也只红 step 不红 job，**必须读 `lint-reports-<sha>` artifact 才知道真相**
  #    （Wave 37 实测：一轮「双绿」的背后是 26 条未被 baseline 吸收的新错误）。
  #
  # 工具链与 Build / unit-tests job 完全同源（JDK 21 temurin / Gradle 9.7.1
  # via setup-gradle / 同一份 ci-gradle.properties），三个 job 的 Gradle
  # User Home 缓存由同一 action 以相同输入生成 key，天然共享、互相命中。
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (baseline gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          # 缓存交给下面的 gradle/actions/setup-gradle，与 Build job 同款约定。

      - name: Bootstrap Android SDK and accept licenses
        # lint 需要 android.jar（compileSdk 36 的 platform）与 AAPT2；
        # 「许可证未接受」会让 SDK 自动下载直接失败，照抄 Build job 的预处理。
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            for candidate in "$HOME/android-sdk" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk" "/opt/android-sdk"; do
              if [ -d "$candidate" ]; then sdk_root="$candidate"; break; fi
            done
          fi
          if [ -z "$sdk_root" ]; then sdk_root="$HOME/android-sdk"; fi

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "::notice::Android SDK root = $sdk_root"

          mkdir -p "$sdk_root/licenses"
          printf '%s\n%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            > "$sdk_root/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a7e0bab842799117058b6a3a0a6' \
            > "$sdk_root/licenses/android-sdk-preview-license"
          printf '%s\n' 'd975f751698a77b662f1254ddbeed3901e976f5a' \
            > "$sdk_root/licenses/intel-android-extra-license"
          printf '%s\n' '601085b94cd77f0b54ff86406957099beebea79f5' \
            > "$sdk_root/licenses/android-googletv-license"

          # 若镜像里带 cmdline-tools，再跑一次官方 license 流程做兜底
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          ls -la "$sdk_root/licenses" || true

      - name: Install CI Gradle properties
        run: |
          mkdir -p "$HOME/.gradle"
          if [ -f .github/ci-gradle.properties ]; then
            cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
            echo "::group::Effective CI gradle.properties"
            cat "$HOME/.gradle/gradle.properties"
            echo "::endgroup::"
          else
            echo "::warning::.github/ci-gradle.properties not found, using project defaults"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 与 Build / unit-tests job 同版本、同参数：三个 job 的 Gradle User
          # Home 缓存 key 前缀一致，互相命中，不产生第二套缓存。
          gradle-version: '9.7.1'
          validate-wrappers: false
          cache-cleanup: on-success
          add-job-summary: 'on-failure'

      - name: Verify Gradle
        run: |
          if ! command -v gradle > /dev/null 2>&1; then
            echo "::error::'gradle' is not on PATH — gradle/actions/setup-gradle failed to install it."
            exit 1
          fi
          gradle --version

      # 门禁全量生效（Wave 37 第四轮：观察期已摘除）：本 step **不再**带
      # continue-on-error —— lint 一旦发现**新增**问题即红 step、红 job。
      # 摘除依据是**硬证据**（不是推测）：上一轮 CI 的 lint-reports-<sha> artifact
      # 里真实新问题 = 0（仅剩一条 LintBaseline Hint），且 lint job 日志为
      # 「Lint found no new issues (and 34 errors and 1 hint filtered by baseline)」
      # + 「BUILD SUCCESSFUL」⇒ 门禁真的会过，而非靠 continue-on-error 兜住。
      - name: Run Android Lint (baseline gate)
        # 【只用 setup-gradle 安装的 gradle，与其他 job 同款】不调 ./gradlew。
        # :app:lintDebug + checkDependencies=true：单次调用覆盖 :app 及其全部
        # library 依赖的源码（AGP 会自动先编译依赖模块的 class 供 lint 分析）。
        # lint 门禁：app/build.gradle.kts lint{} 为 abortOnError=true +
        # warningsAsErrors=true；存量由 app/lint-baseline.xml 冻结（35 条，
        # scripts/arch-guard.sh 第 14 项「只许缩不许涨」守着）吸收，新增问题阻断。
        # 维护纪律：baseline 只许**缩**（修掉存量 ⇒ 删对应条目 + 同步降守卫冻结值），
        # 绝不许**涨**（把新问题 regen 进 baseline = 僵尸豁免，守卫会直接红）。
        # 不加 --continue：单任务调用没有「继续跑其余任务」的语义。
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            :app:lintDebug

      - name: Regenerate lint baseline if missing
        # 兜底：某些 AGP/lint 版本只在 "UpdateBaselineTask" 里写 baseline，
        # 普通 :app:lintDebug 不落盘。这里只在确实没生成时才补跑一次。
        # ⚠️ 本步是**诊断性兜底**，不是门禁 —— 门禁由上方 Run Android Lint 承担
        # （已无 continue-on-error）。故此处保留 continue-on-error + `|| true`：
        # 只在 baseline 缺失（异常态）时才真正执行，任务名不存在也不打断 job，
        # 以免「修不了基线」这一件事把整条流水线的信号淹没。
        id: regen
        if: always()
        continue-on-error: true
        run: |
          if [ -f app/lint-baseline.xml ]; then
            echo "::notice::app/lint-baseline.xml 已存在，跳过兜底再生。"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::lint 未落盘 baseline，尝试 :app:updateLintBaseline 兜底再生"
          gradle \
            --no-daemon \
            --stacktrace \
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}" \
            :app:updateLintBaseline || true
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Locate lint baseline
        # 拿到 baseline 是 Wave 32 第一轮的**唯一目的**：找不到就明确报 error
        # 注解（会进 Annotations 面板），不静默失败。
        id: baseline
        if: always()
        run: |
          path="$(find . -path ./.git -prune -o -type f -name 'lint-baseline.xml' -print 2>/dev/null | head -n 1 || true)"
          if [ -n "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::group::lint-baseline.xml ($path)"
            echo "bytes: $(wc -c < "$path") / issue 条目: $(grep -c '<issue' "$path" || true)"
            head -n 25 "$path" || true
            echo "::endgroup::"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::error::未生成 app/lint-baseline.xml —— 第一轮拿不到基线，第二轮无法翻转门禁。检查上方 'Run Android Lint' 与 'Regenerate lint baseline if missing' 日志。"
            find . -path ./.git -prune -o -type d -name build -print 2>/dev/null | head -n 20 || true
          fi

      - name: Upload lint baseline
        # Wave 32 第一轮的产出物：下载后放进 app/lint-baseline.xml 并提交，
        # 第二轮才能把 abortOnError 翻成 true。只在确实存在时上传。
        if: always() && steps.baseline.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-baseline-${{ github.sha }}
          path: ${{ steps.baseline.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload lint reports
        # 报告无论 job 红绿都上传：供清障审查、与基线核对「存量是否被完整吸收」
        # （观察期后应恒为 0 issue）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/lint-results-debug.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Write job summary
        # 从 lint XML 报告头部的 issues count 提取问题总数；所有分支都有
        # 兜底，本 step 自身绝不失败（不能让 summary 步骤反过来打红 job）。
        if: always()
        run: |
          {
            echo "## Android Lint (baseline gate)"
            echo ""
            xml="app/build/reports/lint-results-debug.xml"
            if [ -f "$xml" ]; then
              count="$(sed -n 's/.*issues[^>]*count="\([0-9]*\)".*/\1/p' "$xml" | head -n 1)"
              echo "Issues found: **${count:-0}** — lint 门禁为**硬门禁**（abortOnError=true + warningsAsErrors=true，存量由 baseline 冻结 35 条吸收，观察期已于 Wave 37 摘除）；完整报告见 artifact \`lint-reports-\`。"
              echo "（存量已由 baseline 吸收，此处为**新增**问题数，理想为 0）"
            else
              echo "未找到 lint XML 报告 —— 检查上方 Run Android Lint 日志。"
            fi
            if [ "${{ steps.baseline.outputs.exists }}" = "true" ]; then
              echo ""
              echo "Baseline：**已生成** → \`${{ steps.baseline.outputs.path }}\`，"
              echo "已作为 artifact \`lint-baseline-\` 上传（保留 30 天）。"
              echo ""
              echo "> 门禁为**硬门禁**（abortOnError=true + warningsAsErrors=true），观察期已于 Wave 37 摘除。"
              echo "> 🔴 排障必读：判定 lint 是否真的通过，**必须看 \`lint-reports-\` artifact**（真实 issue 集），"
              echo "> 不能只看 job 颜色 —— 观察期里 lint 实际失败也只会红 step 不红 job。"
              echo "> 完整 XML 见上方 \`Locate lint baseline\` 步骤的日志折叠块（前 25 行）。"
            else
              echo ""
              echo "Baseline：**未生成** ❌ —— abortOnError=true 下存量 issue 会全量阻断，先看 Annotations 面板并重建 baseline（本步的兜底再生见上方 Regenerate 步骤）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
