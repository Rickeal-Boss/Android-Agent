# =============================================================================
# CI-only Gradle properties
#
# 加载方式：build.yml / release.yml 里执行
#   cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
#
# 优先级说明（高 → 低）：
#   命令行 -D / -P  >  用户级 ~/.gradle/gradle.properties  >  项目级 gradle.properties
# 也就是说本文件会覆盖项目根 gradle.properties 中的同名键。
# 因此这里【只放与「构建环境」相关的开关】，绝不涉及依赖版本 / SDK 版本等工程决策，
# 以免和 app/build.gradle.kts 的约定打架。
# =============================================================================

# -----------------------------------------------------------------------------
# 内存与守护进程
# -----------------------------------------------------------------------------
# GitHub-hosted runner (ubuntu-latest) 约 4 vCPU / 16 GB RAM。
# 4g heap + 1g metaspace 足够 AGP 9 + Compose 编译器，同时给 Kotlin 编译进程留余量。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# CI 是一次性任务，不留常驻守护进程，避免进程残留导致的锁竞争。
org.gradle.daemon=false

# 多模块工程并行执行任务；单模块时无副作用。
# 取舍：并行会让日志交错，排查时可读性下降，
#      但本工程模块数不多且开荒阶段构建耗时敏感，选择开启。
org.gradle.parallel=true

# -----------------------------------------------------------------------------
# 缓存
# -----------------------------------------------------------------------------
# 【重要】配置缓存关闭。
# 取舍：Gradle 9 对配置缓存的支持更激进了，但 AGP 9 + Compose 编译器插件的组合
#      仍有「配置期读取外部输入」导致缓存 miss / 行为不确定的报告。
#      开荒阶段 CI 的正确性优先于几十秒的速度，故显式关闭。
#      等构建稳定后可尝试 org.gradle.configuration-cache=true 并观察缓存命中率。
org.gradle.configuration-cache=false

# 构建缓存（task 级）开启：由 gradle/actions/setup-gradle@v4 负责缓存 ~/.gradle/caches/build-cache-1。
org.gradle.caching=true

# -----------------------------------------------------------------------------
# Kotlin
# -----------------------------------------------------------------------------
# CI 上增量编译没有意义（每次都是全新 checkout），关闭可省掉 Kotlin 守护进程与
# 增量快照的开销，同时规避 kotlin.incremental 在 CI 上的偶发状态不一致。
kotlin.incremental=false

# -----------------------------------------------------------------------------
# Android 构建行为
# -----------------------------------------------------------------------------
# 允许 AGP 自动下载缺失的 platform / build-tools。
# CI 上必须开启（镜像自带的 SDK 版本不一定等于 compileSdk 36）。
# 前提：工作流已预先写好 SDK 许可哈希，否则下载会以「license not accepted」失败。
android.builder.sdkDownload=true

# AGP 8+ 的默认行为，显式声明以保证本地与 CI 一致。
# 若后续新增模块，R 类不再跨模块传递，需要各模块引用自己的 R。
android.nonTransitiveRClass=true

# AGP 8+ 默认 true：R 类字段非 final，支持更好的增量编译。
android.nonFinalResIds=true

# 只要 androidx（本工程无 legacy support 依赖需求）。
android.useAndroidX=true

# -----------------------------------------------------------------------------
# 编码
# -----------------------------------------------------------------------------
# 编码不在这里用 systemProp.file.encoding 设置：
#   1) JVM 启动后设置 file.encoding 对已初始化的默认字符集无效；
#   2) JDK 18+ 默认已是 UTF-8，Gradle 9 跑在 JDK 21 上无需干预；
#   3) 上面的 org.gradle.jvmargs 已带 -Dfile.encoding=UTF-8，覆盖编译进程的场景。
# 若确实遇到跨平台编码问题，改在 .editorconfig / Kotlin 编译器参数层面解决，
# 不要在这里加 systemProp。
